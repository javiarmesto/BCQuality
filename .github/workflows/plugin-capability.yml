name: Validate plugin capability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-plugin-capability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin capability contract
        run: python .github/scripts/validate_plugin_capability.py
